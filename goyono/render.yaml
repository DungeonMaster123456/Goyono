services:
  - type: web
    name: goyono
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PISTON_URL
        sync: false

  - type: web
    name: goyono-piston
    runtime: docker
    plan: starter
    dockerfilePath: ./piston-service/Dockerfile
    dockerContext: ./piston-service
    disk:
      name: piston-data
      mountPath: /piston
      sizeGB: 4
